<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Тестирование{% endblock %} — Портрет личности</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<header class="top">
  <a class="brand" href="{{ url_for('web.index') }}">Портрет личности</a>
  <nav>
    {% if g.user %}
      <a href="{{ url_for('web.cabinet') }}">Кабинет</a>
      {% if g.user['role'] == 'teacher' %}
        <a href="{{ url_for('web.admin') }}">Результаты</a>
        <a href="{{ url_for('web.admin_validate') }}">Валидатор</a>
      {% endif %}
      <form method="post" action="{{ url_for('web.logout') }}" class="inline">
        <input type="hidden" name="_csrf" value="{{ csrf_token }}">
        <button class="link">Выйти ({{ g.user['full_name'] }})</button>
      </form>
    {% else %}
      <a href="{{ url_for('web.login') }}">Вход</a>
      <a href="{{ url_for('web.register') }}">Регистрация</a>
    {% endif %}
  </nav>
</header>
<main>
  {% for category, message in get_flashed_messages(with_categories=true) %}
    <div class="flash {{ category }}">{{ message }}</div>
  {% endfor %}
  {% block content %}{% endblock %}
</main>
</body>
</html>
